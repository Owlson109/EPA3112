<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true" focusable="false">
  <defs>
    <filter id="certificate-scan-detail" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feConvolveMatrix order="3" kernelMatrix="0 -.12 0  -.12 1.48 -.12  0 -.12 0" divisor="1" preserveAlpha="true"/>
    </filter>
    <filter id="certificate-photo-detail" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- Per-channel gains sampled from blank paper in the 864 × 1536 redacted photo.
           Only the 32 × 48 illumination field is stored here. Multiply by 2.1 to decode. -->
      <feImage x="0%" y="0%" width="100%" height="100%" preserveAspectRatio="none" result="paperGain"
               xlink:href="data:image/png;base64,"/>
      <feComposite in="SourceGraphic" in2="paperGain" operator="arithmetic" k1="2.1"/>
      <feConvolveMatrix order="3" kernelMatrix="0 -.19 0  -.19 1.76 -.19  0 -.19 0" divisor="1" preserveAlpha="true"/>
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.04" exponent="1.35" offset="-.018"/>
        <feFuncG type="gamma" amplitude="1.04" exponent="1.35" offset="-.018"/>
        <feFuncB type="gamma" amplitude="1.04" exponent="1.35" offset="-.018"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>
