<section class="slide" data-layout="course-edition" data-title="為何由瑜伽改教運動伸展？" data-speaker="C" aria-label="第14頁：為何由瑜伽改教運動伸展？">
<div class="slide-top"><span class="masthead"><b>EPA3112</b><span>專業及職業教育的政策環境</span></span><span class="chapter-strip"><span class="chapter-part">課程與起點</span><span class="chapter-part">資助、評審與改革</span><span class="chapter-part here">校本實施與成效</span></span><span class="section-mark">2025調整 · 2026.11.17補充</span></div>
<h2>為何由瑜伽改教運動伸展？</h2><div class="slide-content"><div class="naming-spread" data-anim="stagger-list">
  <article class="naming-lead" data-focus="school-market-needs" data-focus-tone="oral">
    <header><span class="tag oral">課程團隊說明</span><h3>為何使用「運動伸展」<br>取代「瑜伽」課程？</h3></header>
    <div class="naming-reasons"><p>回應學校及市場需要。部分學生對「瑜伽」名稱有保留，宗教觀感亦是考慮之一。</p><p>「運動伸展」更清楚表達練習在不同運動中的用途。</p><a data-source="O09" href="appendix.html#O09">O09 · 課程統籌說明</a></div>
  </article>
  <section class="naming-records" aria-label="政策及本科評審背景">
    <article><header><time datetime="2015">2015</time><span>教育局說明</span></header><h3>為何按需要調整課程供應？</h3><p>教育局定期檢視及修訂課程組合，兼顧選擇的均衡、持份者期望及香港的社會經濟需要。院校可按需求開課。</p><a data-source="D100" href="appendix.html#D100">立法會教育事務委員會紀錄 · 頁 13，第 39 段</a></article>
    <article><header><time datetime="2016">2016</time><span>本科評審要求</span></header><h3>加強教練實習</h3><p>評審局要求港專檢討本科內容及結構，適當加入專項運動技能與教授實習，配合課程名稱及學習成效。</p><a data-source="D41" href="appendix.html#D41">評審局本科評審報告 · 印刷頁 3</a></article>
  </section>
  <div class="naming-syllabus"><strong>新版課綱</strong><p>學生按運動項目選擇肌肉群及關節的伸展練習，並學習伸展安全。</p><a data-source="D36" href="appendix.html#D36">單元 4</a></div>
</div></div>
<footer class="deck-footer"><div class="source-refs"><span class="source-label">來源</span><a href="appendix.html#O09" data-source="O09"><b>O09</b> 課程統籌說明</a> <a href="appendix.html#D100" data-source="D100"><b>D100</b> 2015課程取捨說明 · §34、39</a> <a href="appendix.html#D41" data-source="D41"><b>D41</b> 評審局，2016，頁1–4</a> <a href="appendix.html#D36" data-source="D36"><b>D36</b> 教育局，2026–28 課綱，頁 1–2、4–5</a></div><span class="page-label">14 / 17</span></footer>
<aside class="notes"><p class="note-meta">講者 C · 第 14 頁 · 配時 1:10</p><p class="note-purpose">本頁目的：由學校需要、課綱和評審三方面，解釋「運動伸展」如何把跨運動項目的教學用途寫得更清楚。</p><p>我從課程統籌了解到，港專改用「運動伸展」，係想配合學校同市場需要。部分學生對「瑜伽」呢個名有保留，宗教觀感亦係考慮之一。「運動伸展」就更容易畀人明白，呢啲練習點樣用喺唔同運動上。</p><p>點解應用學習嘅課程供應可以隨需要調整？2015年，教育局喺立法會解釋，課程組合要夠均衡，亦要配合持份者期望同香港嘅社會經濟需要，所以會定期檢視同修訂。第39段仲舉咗個例：如果一間中學有好多學生想讀同一科，學校可以同辦學機構商量，專門為佢哋開班。</p><p>呢段講嘅係邊啲課程可以開。至於港專呢科教啲乜，2016年本科評審就要求檢討內容，適當加入專項運動技能同教學實習。我哋估計，呢個方向可能影響咗伸展單元嘅設計：譬如帶籃球隊做伸展，學生要識得揀動作，亦要帶得安全。</p><p class="transition"><strong>過渡：</strong>最後返到開場兩張證書。港專呢科嘅入讀安排、資歷同教學有咩轉變？</p><p class="note-ref">來源：<a href="appendix.html#O09" target="_blank" rel="noopener"><b>O09</b> 課程統籌說明</a> <a href="appendix.html#D100" target="_blank" rel="noopener"><b>D100</b> 2015課程取捨說明 · §34、39</a> <a href="appendix.html#D41" target="_blank" rel="noopener"><b>D41</b> 評審局，2016，頁1–4</a> <a href="appendix.html#D36" target="_blank" rel="noopener"><b>D36</b> 教育局，2026–28 課綱，頁 1–2、4–5</a></p></aside></section>
</template>

<h2>港專「運動及體適能教練」的轉變</h2><div class="slide-content"><div class="entries-layout"><section class="entries-report"><h3>本科歷屆文憑試報考人數</h3><p class="entries-key">全體考生（人） · 按文憑試年份排列</p><ol class="entries-chart" aria-label="2016至2026年科目674報考人數"><li title="2015/16 學年，2016 DSE，全體報考 134 人"><div class="entry-column"><b>134</b><i aria-hidden="true" style="--entries:134"></i></div><span>2016</span></li><li title="2016/17 學年，2017 DSE，全體報考 100 人"><div class="entry-column"><b>100</b><i aria-hidden="true" style="--entries:100"></i></div><span>2017</span></li><li title="2017/18 學年，2018 DSE，全體報考 107 人"><div class="entry-column"><b>107</b><i aria-hidden="true" style="--entries:107"></i></div><span>2018</span></li><li title="2018/19 學年，2019 DSE，全體報考 122 人"><div class="entry-column"><b>122</b><i aria-hidden="true" style="--entries:122"></i></div><span>2019</span></li><li title="2019/20 學年，2020 DSE，全體報考 125 人"><div class="entry-column"><b>125</b><i aria-hidden="true" style="--entries:125"></i></div><span>2020</span></li><li title="2020/21 學年，2021 DSE，全體報考 135 人"><div class="entry-column"><b>135</b><i aria-hidden="true" style="--entries:135"></i></div><span>2021</span></li><li title="2021/22 學年，2022 DSE，全體報考 116 人"><div class="entry-column"><b>116</b><i aria-hidden="true" style="--entries:116"></i></div><span>2022</span></li><li title="2022/23 學年，2023 DSE，全體報考 110 人"><div class="entry-column"><b>110</b><i aria-hidden="true" style="--entries:110"></i></div><span>2023</span></li><li title="2023/24 學年，2024 DSE，全體報考 237 人"><div class="entry-column"><b>237</b><i aria-hidden="true" style="--entries:237"></i></div><span>2024</span></li><li title="2024/25 學年，2025 DSE，全體報考 300 人"><div class="entry-column"><b>300</b><i aria-hidden="true" style="--entries:300"></i></div><span>2025</span></li><li title="2025/26 學年，2026 DSE，全體報考 338 人"><div class="entry-column"><b>338</b><i aria-hidden="true" style="--entries:338"></i></div><span>2026*</span></li></ol>
<p class="entries-reading"><strong>2024 年增幅最大</strong><br>由 110 人增至 237 人，一屆多了 127 人。</p>
<p class="entries-source">2016 年對應 2015/16 學年，如此類推。<a data-source="D104" href="appendix.html#D104">歷年統計</a><br>* 2026 年採用截至 2025 年 12 月 17 日的<a data-source="D105" href="appendix.html#D105">報考統計</a>。</p></section><section class="entries-policy"><h3>政策及課程的轉變</h3><dl>
<div><dt>2016/17 學年</dt><dd>政府全數資助高中生修讀最多兩個應用學習課程。 <a data-source="D68" href="appendix.html#D68">D68</a></dd></div>
<div><dt>2017、2019 年</dt><dd>本科獲資歷架構第 3 級認可。其後續評要求實踐單元加入心肺訓練。 <a data-source="D41" href="appendix.html#D41">D41</a> <a data-source="D42" href="appendix.html#D42">D42</a></dd></div>
<div><dt>2020/21 學年</dt><dd>港專本科可提早於中四開課，與中五開課的同屆學生一同報考 2023 年文憑試。 <a data-source="D103" href="appendix.html#D103">D103</a></dd></div>
<div><dt>2025–27 與 2026–28 屆</dt><dd>兩屆課綱分別列瑜伽及伸展運動，同為 20 小時。新課綱另將教練與訓練設計合為 60 小時。 <a data-source="D24" href="appendix.html#D24">D24</a> <a data-source="D36" href="appendix.html#D36">D36</a></dd></div></dl></section></div><section class="summary-assessment" data-focus="closing-analysis"><div><span>2025 年文憑試 · 本科評核</span><h3>由設計訓練到親身帶領</h3></div><p>學生三至四人一組，為指定群組設計及帶領訓練。</p><div class="summary-weight"><strong>30<small>%</small></strong><a data-source="D30" href="appendix.html#D30">課業 7 佔本科總分</a></div></section></div>
<footer class="deck-footer"><div class="source-refs"><span class="source-label">來源</span><a href="appendix.html#D104" data-source="D104"><b>D104</b> 考評局，表7f，頁34、45</a> <a href="appendix.html#D105" data-source="D105"><b>D105</b> 考評局，2026報考統計，頁4</a> <a href="appendix.html#D68" data-source="D68"><b>D68</b> 2017落實回顧 · §16</a> <a href="appendix.html#D41" data-source="D41"><b>D41</b> 評審局，2016，頁1–4</a> <a href="appendix.html#D42" data-source="D42"><b>D42</b> 評審局，2019，頁6–7／10–11</a> <a href="appendix.html#D103" data-source="D103"><b>D103</b> 教育局，通函69/2020，頁7</a> <a href="appendix.html#D24" data-source="D24"><b>D24</b> 教育局，課綱2025–27，頁2</a> <a href="appendix.html#D36" data-source="D36"><b>D36</b> 教育局，2026–28 課綱，頁 1–2、4–5</a> <a href="appendix.html#D30" data-source="D30"><b>D30</b> 考評局，674 評核方案，課業 7</a></div><span class="page-label">15 / 17</span></footer>
<aside class="notes"><p class="note-meta">講者 C · 第 15 頁 · 配時 1:00</p><p class="note-purpose">本頁目的：對照本科逐屆報考人數、提早修讀安排及課程內容，說明哪幾屆增長最明顯，以及學生何時可開始修讀。</p><p>港專呢科，2016年有134人報考，頭八年喺100到135人之間上落。最大轉變係2024年，由上一屆110人升到237人。2025年有300人，2026年報考統計有338人。</p><p>中四開課改變咗啲乜？按教育局通函，2020/21學年讀中四嘅學生可以早一年接觸教練訓練，同中五先開始嘅同學一樣報2023年文憑試。考評局只列全科總數，分唔出有幾多人因為可以早讀而選呢科。</p><p>教學亦有轉變，2019年續評要求加入心肺訓練，到2026至28屆，課綱由瑜伽改列伸展。最後都係返到做教練：學生除咗自己識做，仲要識設計訓練、帶人做。</p><p class="transition"><strong>過渡：</strong>多謝大家，歡迎提問。</p><p class="note-ref">來源：<a href="https://www.hkeaa.edu.hk/DocLibrary/HKDSE/Exam_Report/Examination_Statistics/dseexamstat25_7.pdf#page=34" target="_blank" rel="noopener"><b>D104</b> 考評局，表7f，頁34、45</a> <a href="https://www.hkeaa.edu.hk/DocLibrary/Media/FactFigures/2026_HKDSE_registration_statistics.pdf#page=4" target="_blank" rel="noopener"><b>D105</b> 考評局，2026報考統計，頁4</a> <a href="appendix.html#D68" target="_blank" rel="noopener"><b>D68</b> 2017落實回顧 · §16</a> <a href="appendix.html#D41" target="_blank" rel="noopener"><b>D41</b> 評審局，2016，頁1–4</a> <a href="appendix.html#D42" target="_blank" rel="noopener"><b>D42</b> 評審局，2019，頁6–7／10–11</a> <a href="appendix.html#D103" target="_blank" rel="noopener"><b>D103</b> 教育局，通函69/2020，頁7</a> <a href="appendix.html#D24" target="_blank" rel="noopener"><b>D24</b> 教育局，課綱2025–27，頁2</a> <a href="appendix.html#D36" target="_blank" rel="noopener"><b>D36</b> 教育局，2026–28 課綱，頁 1–2、4–5</a> <a href="appendix.html#D30" target="_blank" rel="noopener"><b>D30</b> 考評局，674 評核方案，課業 7</a></p></aside></section>
