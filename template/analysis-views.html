<section class="slide" data-layout="course-edition" data-title="為何由瑜伽改教運動伸展？" data-speaker="C" aria-label="第14頁：為何由瑜伽改教運動伸展？">
<div class="slide-top"><span class="masthead"><b>EPA3112</b><span>專業及職業教育的政策環境</span></span><span class="chapter-strip"><span class="chapter-part">課程與起點</span><span class="chapter-part">資助、評審與改革</span><span class="chapter-part here">校本實施與成效</span></span><span class="section-mark">2025調整 · 2026.11.17補充</span></div>
<h2>為何由瑜伽改教運動伸展？</h2><div class="slide-content"><div class="naming-spread" data-anim="stagger-list">
  <article class="naming-lead" data-focus="school-market-needs" data-focus-tone="oral">
    <header><span class="tag oral">課程團隊說明</span><h3>為何使用「運動伸展」<br>取代「瑜伽」課程？</h3></header>
    <div class="naming-reasons"><p>回應學校及市場需要。部分學生對「瑜伽」名稱有保留，宗教觀感亦是考慮之一。</p><p>「運動伸展」更清楚表達練習在不同運動中的用途。</p><a data-source="O09" href="appendix.html#O09">O09 · 課程統籌說明</a></div>
  </article>
  <section class="naming-records" aria-label="政策及本科評審背景">
    <article><header><time datetime="2015">2015</time><span>教育局說明</span></header><h3>為何按需要調整課程供應？</h3><p>教育局定期檢視及修訂課程組合，兼顧選擇的均衡、持份者期望及香港的社會經濟需要。院校可按需求開課。</p><a data-source="D100" href="appendix.html#D100">立法會教育事務委員會紀錄 · 頁 13，第 39 段</a></article>
    <article><header><time datetime="2016">2016</time><span>本科評審要求</span></header><h3>加強教練實習</h3><p>評審局要求港專檢討本科內容及結構，適當加入專項運動技能與教授實習，配合課程名稱及學習成效。</p><a data-source="D41" href="appendix.html#D41">評審局本科評審報告 · 印刷頁 3</a></article>
  </section>
  <div class="naming-syllabus"><strong>新版課綱</strong><p>學生按運動項目選擇肌肉群及關節的伸展練習，並學習伸展安全。</p><a data-source="D36" href="appendix.html#D36">單元 4</a></div>
</div></div>
<footer class="deck-footer"><div class="source-refs"><span class="source-label">來源</span><a href="appendix.html#O09" data-source="O09"><b>O09</b> 課程統籌說明</a> <a href="appendix.html#D100" data-source="D100"><b>D100</b> 2015課程取捨說明 · §34、39</a> <a href="appendix.html#D41" data-source="D41"><b>D41</b> 評審局，2016，頁1–4</a> <a href="appendix.html#D36" data-source="D36"><b>D36</b> 教育局，2026–28 課綱，頁 1–2、4–5</a></div><span class="page-label">14 / 17</span></footer>
<aside class="notes"><p class="note-meta">講者 C · 第 14 頁 · 配時 1:10</p><p class="note-purpose">本頁目的：由學校需要、課綱和評審三方面，解釋「運動伸展」如何把跨運動項目的教學用途寫得更清楚。</p><p>我從課程統籌了解到，港專改用「運動伸展」，係想配合學校同市場需要。部分學生對「瑜伽」呢個名有保留，宗教觀感亦係考慮之一。「運動伸展」就更容易畀人明白，呢啲練習點樣用喺唔同運動上。</p><p>點解應用學習嘅課程供應可以隨需要調整？2015年，教育局喺立法會解釋，課程組合要夠均衡，亦要配合持份者期望同香港嘅社會經濟需要，所以會定期檢視同修訂。第39段仲舉咗個例：如果一間中學有好多學生想讀同一科，學校可以同辦學機構商量，專門為佢哋開班。</p><p>呢段講嘅係邊啲課程可以開。至於港專呢科教啲乜，2016年本科評審就要求檢討內容，適當加入專項運動技能同教學實習。我哋估計，呢個方向可能影響咗伸展單元嘅設計：譬如帶籃球隊做伸展，學生要識得揀動作，亦要帶得安全。</p><p class="transition"><strong>過渡：</strong>最後返到開場兩張證書。港專呢科嘅入讀安排、資歷同教學有咩轉變？</p><p class="note-ref">來源：<a href="appendix.html#O09" target="_blank" rel="noopener"><b>O09</b> 課程統籌說明</a> <a href="appendix.html#D100" target="_blank" rel="noopener"><b>D100</b> 2015課程取捨說明 · §34、39</a> <a href="appendix.html#D41" target="_blank" rel="noopener"><b>D41</b> 評審局，2016，頁1–4</a> <a href="appendix.html#D36" target="_blank" rel="noopener"><b>D36</b> 教育局，2026–28 課綱，頁 1–2、4–5</a></p></aside></section>

  <aside class="notes"><p class="note-meta">講者 C · 第 15 頁 · 配時 1:00</p><p class="note-purpose">本頁目的：回到兩張證書，總結港專本科的入讀機會、實習和認可，再以浸大國際學院的高級文憑說明升學選擇。</p><p>睇返兩張證書，我嗰屆中五先讀港專。2020/21學年起，中四就可以試做教練。</p><p>2016/17學年起，高中生最多兩科獲全數資助，當年全港應用學習津貼超過6,000萬蚊。一般課程嘅實際開支，由2021/22學年嘅1億1,520萬，增至2024/25學年嘅1億7,030萬。三年多咗5,510萬，接近四成八。</p><p>再睇課堂。馬鞍山嘅課程有羽毛球同籃球，2019年續評要求實習加入心肺訓練。港專因應學校同市場需要改教運動伸展，學生要識揀動作、帶得安全。</p><p>兩張證書上嘅 Sports 變成 Exercise，新證書列明資歷架構第三級。至於個人表現，2018年起，優異（I）相當於甲類第3級，優異（II）相當於第4級或以上。</p><p>浸大國際學院嘅運動教練學及運動行政學高級文憑接受應用學習成績，亦有其他入學要求。學生揀路嗰陣，可以問自己「我鍾意做運動，係咪都鍾意教人？」</p><p class="transition"><strong>結語：</strong>多謝大家。</p><p class="note-ref">來源：<a href="https://applications.edb.gov.hk/circular/upload/EDBCM/EDBCM08146C.pdf#page=1" target="_blank" rel="noopener" title="教育局通函 146/2008，第 2–3 段，新高中多元學習津貼及應用學習"><b>D01</b> 教育局通函 146/2008，第 2–3 段，新高中多元學習津貼及應用學習</a> <a href="https://www.legco.gov.hk/yr14-15/chinese/panels/ed/papers/ed20150316cb4-620-2-c.pdf#page=14" target="_blank" rel="noopener" title="立法會教育事務委員會，2015 年，附錄四第 14 頁，港專列名屆別"><b>D05</b> 立法會教育事務委員會，2015 年，附錄四第 14 頁，港專列名屆別</a> <a href="https://www.legco.gov.hk/yr16-17/chinese/hc/sub_com/hs101/papers/hs10120171104cb4-134-2-c.pdf#page=4" target="_blank" rel="noopener" title="2017 年立法會文件，第 16 段，全數資助最多兩科"><b>D68</b> 2017 年立法會文件，第 16 段，全數資助最多兩科</a> <a href="https://www.edb.gov.hk/attachment/tc/about-edb/press/legco/replies-to-fc/2324_EDB-2-c1.pdf#page=431" target="_blank" rel="noopener"><b>D110</b> 教育局 EDB125，頁421（2021/22實際開支）</a> <a href="https://www.edb.gov.hk/attachment/tc/about-edb/press/legco/replies-to-fc/edb-c-2627.pdf#page=224" target="_blank" rel="noopener"><b>D79</b> 教育局 EDB066，頁216（2024/25實際開支）</a> <a href="https://www.edb.gov.hk/attachment/tc/curriculum-development/renewal/CM/EDBCM20069C.pdf#page=7" target="_blank" rel="noopener" title="教育局通函 69/2020，附錄一第 7 頁，科目 674"><b>D103</b> 教育局通函 69/2020，附錄一第 7 頁，科目 674</a> <a href="https://hkcaavq.edu.hk/upload/report/1121/file/Summary%20Report_HKCT_1_LPA_4Re-LPA_VA1007_20200120.pdf#page=11"
